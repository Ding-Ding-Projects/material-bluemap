name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A later push supersedes an in-flight run on the same ref, except on main where
# every push is meant to produce its own release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # A workflow file with an invalid expression is not a workflow that fails - it is a
  # workflow that never registers. It disappears from the Actions list, `gh workflow run`
  # reports it as not found, and the only symptom is a zero-second "workflow file issue"
  # hung on some unrelated push. `Render world` shipped in that state and nobody could
  # have told from a green CI run, because nothing here ever read those files.
  #
  # This job reads them. It is deliberately first and deliberately cheap: it needs no
  # checkout of anything but the workflows and no toolchain at all.
  workflows:
    name: Lint the workflow files
    runs-on: ubuntu-latest
    steps:
      # Full history and every tag: the changelog check below derives its versions from
      # the tags and its entries from the commits, and a depth-1 checkout would report a
      # changelog covering one version as current.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pull requests are otherwise checked out at GitHub's synthetic merge
          # commit. The generated changelog follows the branch history, so lint
          # the actual PR head instead of inventing an unlisted merge entry.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The changelog is generated from the repository, so it can go stale the moment
      # anything is pushed without regenerating it. This says so here rather than letting
      # a release ship notes that stop at last week.
      - name: The changelog matches the history it is generated from
        run: node scripts/build-changelog.mjs --check

      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.7
          curl -fsSL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          # The runner already ships shellcheck, so the `run:` blocks get checked too.
          # (That sentence must not begin with the word shellcheck: a comment starting
          # "# shellcheck" is parsed as a shellcheck *directive*, and a malformed one
          # fails the very lint step this comment sits in.)
          ./actionlint -color

  check:
    name: Lint, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design
    steps:
      # The vendored BlueMap submodule is a large Java reference tree that
      # nothing in the build reads, so it is deliberately not checked out.
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: design/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      # After `build`, never before: a package resolves a sibling `@material-bluemap/*`
      # through that sibling's emitted `dist/*.d.ts`, so on a clean checkout every
      # cross-package import is a "cannot find module" until the build has run.
      #
      # It is a separate step from `build` because building does not type-check
      # everything: `ui` goes through Vite, which transpiles file by file and never
      # checks a template, and plain `tsc` cannot read a `.vue` import at all — so that
      # one package runs `vue-tsc` instead.
      - run: pnpm typecheck
      - run: pnpm test

  package:
    name: Windows installer
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: design/pnpm-lock.yaml

      - name: Install
        working-directory: design
        run: pnpm install --frozen-lockfile

      # The app bundles the workspace packages, so they have to be built first.
      - name: Build workspace
        working-directory: design
        run: pnpm build

      # Every build must carry a version Squirrel can order, or installing a newer
      # release over an older one silently does nothing: same version, nothing to do,
      # no error and no upgrade. `0.1.<run number>` is monotonic, is valid semver, and
      # is valid NuGet, which Squirrel requires.
      - name: Stamp this build's version
        id: version
        shell: bash
        working-directory: design/packages/app
        run: |
          set -euo pipefail
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          version="${base}.${GITHUB_RUN_NUMBER}"
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,4)+String.fromCharCode(10));" "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building installer version $version"

      - name: Build Squirrel.Windows installer
        working-directory: design/packages/app
        run: pnpm run make

      - name: Collect installer artifacts
        shell: bash
        working-directory: design/packages/app
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/installer-out"
          found=0
          # Only the Squirrel output directory. A plain `*.exe` sweep also picks up
          # `win-unpacked/Material BlueMap.exe`, which is the unpacked binary: 204 MB,
          # useless on its own, and the largest thing in the release.
          for dir in release/squirrel-windows dist/squirrel-windows ../../release/squirrel-windows; do
            [ -d "$dir" ] || continue
            while IFS= read -r f; do
              cp "$f" "$GITHUB_WORKSPACE/installer-out/"
              found=1
            done < <(find "$dir" -maxdepth 1 -type f \( -name '*Setup.exe' -o -name '*.nupkg' -o -name 'RELEASES' -o -name 'Squirrel.exe' \))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no installer artifacts were produced by electron-builder"
            exit 1
          fi
          ls -la "$GITHUB_WORKSPACE/installer-out"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer-out/
          if-no-files-found: error
          retention-days: 30

  # The renderer itself: all seven BlueMap implementations, built from the vendored
  # upstream source. Decision D18 makes the six Minecraft-server adapters product
  # artefacts alongside the CLI, so they are built on every push and attached to every
  # release. It is a called workflow rather than a separate one on its own trigger,
  # which is what puts its artifacts in this run where the release job can reach them.
  # Independent of `check`, so it runs beside the TypeScript build instead of after it.
  jars:
    name: BlueMap jars
    uses: ./.github/workflows/build-jars.yml

  # A world of our own, rendered by the Java engine, so the screenshot harness never
  # touches somebody else's public demo server. Closes issue #17: every push used to
  # pull map tiles from bluecolored.de, which is another person's bandwidth, made the
  # captures depend on a third party's uptime, and let a screenshot of a fully rendered
  # world imply this project had rendered it.
  test-world:
    name: Generate and render a test world
    needs: [check, jars]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: design/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/download-artifact@v4
        with:
          name: bluemap-jar-cli
          path: jar

      - name: Install and build
        working-directory: design
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # A different seed every push, derived from the run id so it is fresh but
      # recorded and reproducible rather than merely random.
      - name: Generate the world
        id: world
        run: |
          set -euo pipefail
          seed=$(( GITHUB_RUN_ID % 2147483647 ))
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "Generating a 1000x1000 world with seed $seed"
          node design/packages/worldgen/dist/cli.js             --seed "$seed" --size 1000 --out "$GITHUB_WORKSPACE/test-world"
          ls -la "$GITHUB_WORKSPACE/test-world"

      - name: Render it with the Java engine
        id: render
        run: |
          set -euo pipefail
          # Absolute, because the render below runs from a different working directory
          # and a relative jar path stops resolving the moment we cd.
          jar=$(find "$GITHUB_WORKSPACE/jar" -name '*.jar' | head -1)
          world=$(find "$GITHUB_WORKSPACE/test-world" -maxdepth 1 -type d -name 'test-world-seed-*' | head -1)
          config="$GITHUB_WORKSPACE/render-config"
          out="$GITHUB_WORKSPACE/render-out"
          mkdir -p "$out"

          # Generate the config set, then point it at our world. Absolute paths
          # throughout: the CLI resolves its storage root against the working
          # directory, not the config folder it was given.
          java -jar "$jar" -c "$config" || true
          sed -i 's/^accept-download: false/accept-download: true/' "$config/core.conf"
          sed -i "s|^world: .*|world: \"$world\"|" "$config/maps/overworld.conf"
          mv "$config/maps/nether.conf" "$config/maps/nether.conf.off"
          mv "$config/maps/end.conf" "$config/maps/end.conf.off"

          cd "$out"
          java -jar "$jar" -c "$config" -r -g
          echo "tiles=$(find "$out/web/maps" -name '*.prbm*' | wc -l)" >> "$GITHUB_OUTPUT"
          du -sh "$out/web"

      - name: Record what rendered it
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/render-out/provenance.json" <<JSON
          {
            "engine": "upstream BlueMap Java engine, built from the vendored source",
            "seed": ${{ steps.world.outputs.seed }},
            "sizeBlocks": 1000,
            "hiresTiles": ${{ steps.render.outputs.tiles }},
            "commit": "${{ github.sha }}",
            "run": "${{ github.run_id }}"
          }
          JSON
          cat "$GITHUB_WORKSPACE/render-out/provenance.json"

      - name: Package the world for the release
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/test-world"
          zip -qr "$GITHUB_WORKSPACE/test-world-seed-${{ steps.world.outputs.seed }}.zip" .
          ls -la "$GITHUB_WORKSPACE"/test-world-seed-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: test-world
          path: test-world-seed-*.zip
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: rendered-map
          path: |
            render-out/web
            render-out/provenance.json
          if-no-files-found: error
          retention-days: 7

  screenshots:
    name: Screenshots
    needs: [check, test-world]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: design/pnpm-lock.yaml

      - name: Install
        working-directory: design
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        working-directory: design
        run: pnpm build

      - uses: actions/download-artifact@v4
        with:
          name: rendered-map
          path: rendered-map

      - name: Install Playwright browsers
        working-directory: design/packages/app
        run: pnpm exec playwright install-deps chromium

      # Electron needs a display. xvfb gives it one without a desktop session.
      # `local` mode serves the map this run rendered, so the captures are
      # self-contained and reproducible, and the network guard fails the job if the
      # app reaches the public internet at all during capture.
      - name: Capture
        working-directory: design/packages/app
        env:
          MATERIAL_BLUEMAP_CAPTURE_MODE: local
          MATERIAL_BLUEMAP_CAPTURE_MAP: ${{ github.workspace }}/rendered-map/web
          MATERIAL_BLUEMAP_CAPTURE_PROVENANCE: ${{ github.workspace }}/rendered-map/provenance.json
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" pnpm run screenshots

      # Upload even when the capture failed: a diagnostic image of a broken
      # window is exactly the evidence needed to fix it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: design/packages/app/screenshots/
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-traces
          path: design/packages/app/test-results/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish release
    needs: [check, package, jars, test-world]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The line counter attributes surviving lines with `git blame`, so it
      # needs the full history rather than a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm before setup-node, so the node cache can key off the lockfile.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: design/pnpm-lock.yaml

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer-out

      # The seven jars were uploaded one artifact per implementation so a person can
      # take only the one their server needs; here they are collected back into one
      # directory, together with the checksums and the release-notes section the build
      # wrote from the jars it had actually produced.
      - uses: actions/download-artifact@v4
        with:
          pattern: bluemap-jar-*
          merge-multiple: true
          path: jars-out

      # A world anybody can render themselves, with the seed stated so the exact one
      # in this release can be regenerated byte for byte.
      - uses: actions/download-artifact@v4
        with:
          name: test-world
          path: world-out

      # Artifact upload and download is a round trip through someone else's storage, and
      # a jar that arrives short is a download that fails on a stranger's server rather
      # than here. The digests were taken from the bytes the build produced, so checking
      # them proves what is about to be published is what was actually built.
      - name: Verify the jars survived the artifact round trip
        shell: bash
        run: |
          set -euo pipefail
          cd jars-out
          shopt -s nullglob
          jars=(bluemap-*.jar)
          if [ "${#jars[@]}" -ne 7 ]; then
            echo "::error::expected all seven BlueMap jars, found ${#jars[@]}. A release must not ship a partial set."
            ls -la
            exit 1
          fi
          sha256sum -c bluemap-jars.sha256.txt
          ls -la

      # A GitHub release asset is capped at 2 GB, and a rendered world is tens of
      # gigabytes of tiles. Anything over the cap is published as 1.7 GB parts beside a
      # manifest and put back together by the consumer, so the splitter has to be built
      # before the release is composed. `--ignore-scripts` skips Electron's binary
      # download, which is the slow part of an install and is not needed to run `tsc`.
      - name: Build the archive splitter
        working-directory: design
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @material-bluemap/parts run build

      # Nothing happens here on an ordinary build: every asset this release carries today
      # is far under the cap, `split` stays 0, and the notes below say nothing about
      # splitting. The step exists for the day a rendered world is attached.
      - name: Split oversized release assets
        id: split
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p split-out
          split_any=0
          split_names=()
          for asset in installer-out/* jars-out/bluemap-*.jar world-out/*.zip; do
            [ -f "$asset" ] || continue
            size=$(stat -c%s "$asset")
            if [ "$size" -le 2000000000 ]; then
              continue
            fi
            echo "$asset is $size bytes, over the 2 GB release-asset cap; splitting it."
            node scripts/split-parts.mjs "$asset" --out split-out
            # The oversized original is removed so the publish globs below cannot pick
            # it up and hand GitHub a file it is certain to refuse.
            rm -f "$asset"
            split_any=1
            split_names+=("$(basename "$asset")")
          done
          if [ "$split_any" -eq 1 ]; then
            ls -la split-out
            printf 'names=%s\n' "$(IFS=,; echo "${split_names[*]}")" >> "$GITHUB_OUTPUT"
          fi
          echo "split=$split_any" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./design/package.json').version")
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists; refusing to recycle a published release"
            exit 1
          fi
          # The release ordinal drives the dim sum code name. It is monotonic, so
          # a dish is never silently reused, and no ledger has to be committed
          # back by CI, which would be an automation loop.
          count=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq 'length')
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "ordinal=$((count + 1))"
          } >> "$GITHUB_OUTPUT"

      # Not a gate: a release must never be blocked because the photo catalog is
      # unavailable. A failure here is reported in the notes instead.
      - name: Resolve dim sum code name
        id: dish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/pick-dim-sum.mjs --ordinal "${{ steps.tag.outputs.ordinal }}" --out dim-sum-out

      - name: Compose release notes
        run: |
          set -euo pipefail
          {
            if [ -n "${{ steps.dish.outputs.dish_name_en }}" ]; then
              echo "**Code name: ${{ steps.dish.outputs.dish_name_en }} · ${{ steps.dish.outputs.dish_name_zh }}**"
              echo
              echo "![${{ steps.dish.outputs.dish_alt_en }}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.tag.outputs.tag }}/${{ steps.dish.outputs.dish_file_name }})"
              echo
              echo "Photo from the public \`Ding-Ding-Projects/dim-sum-photos\` catalog, volume \`${{ steps.dish.outputs.dish_volume }}\`, downloaded unchanged at release time and verified to decode. It is not stored in this repository."
            else
              echo "> [!NOTE]"
              echo "> No dim sum photo is attached to this release: resolving one from the photo catalog failed. The \`Resolve dim sum code name\` step in the run log has the exact URL and status. No substitute was generated."
            fi
            echo
            echo "## Install"
            echo
            echo "Download the Squirrel.Windows installer below. Windows only for now; macOS and Linux packaging land in a later phase."
            echo
            echo "The seven \`bluemap-*.jar\` files are a separate download and are not needed to install the desktop application. Take one only to run BlueMap on a Minecraft server or from a command line; the table below says which is which."
            echo
            cat jars-out/bluemap-jars.md
            if [ "${{ steps.split.outputs.split }}" = "1" ]; then
              echo "## One download arrived in pieces"
              echo
              echo "A GitHub release asset cannot be larger than 2 GB, and this one is: \`${{ steps.split.outputs.names }}\`. It is published as \`<name>.001\`, \`<name>.002\`, ... beside a \`<name>.parts.json\` that carries the size and SHA-256 of every part and of the whole file."
              echo
              echo "**In the desktop application**, nothing has to be done: it finds the manifest, downloads every part with resume, checks each one, rejoins them and unpacks the result."
              echo
              echo "**By hand**, download every numbered part and the \`.parts.json\` into one directory, then run:"
              echo
              echo '```sh'
              echo "node scripts/join-parts.mjs <name>.parts.json"
              echo '```'
              echo
              echo "It verifies each part as it appends it and the whole file at the end, names the exact part if one is wrong, and picks up where it left off if it is interrupted."
              echo
            fi
            echo "## What is in this build"
            echo
            echo "Commit \`${GITHUB_SHA}\` on \`main\`, built and tested by [run ${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). This release exists only because lint, build and the full test suite passed first."
            echo
            node scripts/count-lines.mjs --format=markdown
          } > release-notes.md
          echo "Composed $(wc -l < release-notes.md) lines of release notes"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # An asset that was split has been removed from its own directory, so without
          # this a glob that now matches nothing would be passed to `gh` as a literal
          # pattern and refused as a missing file.
          shopt -s nullglob
          # A release should answer "what do I download" in one glance. The installer
          # is that answer, so it is the only loose artefact besides the code-name
          # photo, which has to stay a real image for the notes above to render it.
          #
          # Everything else - the seven server jars, their digests, the generated test
          # world, and the Squirrel update files - goes into one archive. None of it is
          # what a person arriving at the page wants first, and fifteen assets of which
          # fourteen are for somebody else is a worse page than two and an archive.
          shopt -s nullglob

          # The seven server plugins get their own archive with their own name, rather
          # than being buried inside a generic one. Somebody running a Paper server is
          # looking for exactly this and should not have to guess which download holds
          # it.
          jars="bluemap-server-plugins-${{ needs.jars.outputs.version }}"
          mkdir -p "$jars"
          cp jars-out/bluemap-*.jar jars-out/bluemap-jars.sha256.txt jars-out/bluemap-jars.json "$jars/"
          cat > "$jars/README.txt" <<TXT
          BlueMap ${{ needs.jars.outputs.version }} server plugins

          One jar per Minecraft server platform, built from the upstream source
          vendored in this repository. Take only the one your server runs:

            bluemap-*-paper.jar     Paper
            bluemap-*-spigot.jar    Spigot
            bluemap-*-fabric.jar    Fabric
            bluemap-*-forge.jar     Forge
            bluemap-*-neoforge.jar  NeoForge
            bluemap-*-sponge.jar    Sponge
            bluemap-*-cli.jar       command line renderer, no server needed

          Verify with bluemap-jars.sha256.txt. These are builds of upstream BlueMap,
          not a reimplementation.
          TXT
          zip -qr "$jars.zip" "$jars"

          # Everything else that is not the installer and not the plugins.
          extras="material-bluemap-${{ steps.tag.outputs.tag }}-extras"
          mkdir -p "$extras"/{test-world,update}
          cp world-out/*.zip "$extras/test-world/"
          # The .nupkg and RELEASES are the update set and must exist - an unmatched
          # glob or a missing file fails this loudly. Squirrel.exe is different:
          # electron-builder keeps it inside the package, so no standalone copy exists
          # to collect, and requiring one is why build.91's publish died.
          for f in installer-out/*.nupkg installer-out/RELEASES; do
            cp "$f" "$extras/update/"
          done
          if [ -e installer-out/Squirrel.exe ]; then
            cp installer-out/Squirrel.exe "$extras/update/"
          fi
          cat > "$extras/README.txt" <<TXT
          material-bluemap ${{ steps.tag.outputs.tag }} - extras

          test-world/  A Minecraft save this project generated in anvil format, with
                       the seed in its file name. No Minecraft installation and no
                       Mojang download are needed to render it.
          update/      Squirrel update files that accompany the installer. You do not
                       need these to install; they are here so the set is complete.

          The installer and the server plugins are separate downloads on the release
          page.
          TXT
          zip -qr "$extras.zip" "$extras"
          echo "server plugins: $(du -h "$jars.zip" | cut -f1)   extras: $(du -h "$extras.zip" | cut -f1)"

          assets=(installer-out/*Setup.exe "$jars.zip" "$extras.zip")
          # The parts and manifest of anything that was over the 2 GB cap, attached
          # instead of the oversized file rather than beside it.
          assets+=(split-out/*)
          if [ -d dim-sum-out ] && [ -n "$(ls -A dim-sum-out 2>/dev/null)" ]; then
            assets+=(dim-sum-out/*)
          fi
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no assets were resolved for the release"
            exit 1
          fi
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "material-bluemap ${{ steps.tag.outputs.tag }}" \
            --notes-file release-notes.md \
            "${assets[@]}"
          gh release view "${{ steps.tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
            --jq 'if .isDraft then error("release was published as a draft") else "published with \(.assets | length) assets" end'
