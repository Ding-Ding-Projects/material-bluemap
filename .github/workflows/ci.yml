name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A later push supersedes an in-flight run on the same ref, except on main where
# every push is meant to produce its own release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design
    steps:
      # The vendored BlueMap submodule is a large Java reference tree that
      # nothing in the build reads, so it is deliberately not checked out.
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: design/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  package:
    name: Windows installer
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: design/pnpm-lock.yaml

      - name: Install
        working-directory: design
        run: pnpm install --frozen-lockfile

      # The app bundles the workspace packages, so they have to be built first.
      - name: Build workspace
        working-directory: design
        run: pnpm build

      - name: Build Squirrel.Windows installer
        working-directory: design/packages/app
        run: pnpm run make

      - name: Collect installer artifacts
        shell: bash
        working-directory: design/packages/app
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/installer-out"
          found=0
          # electron-builder writes to release/ or dist/ depending on config.
          for dir in release dist ../../release ../../dist; do
            [ -d "$dir" ] || continue
            while IFS= read -r f; do
              cp "$f" "$GITHUB_WORKSPACE/installer-out/"
              found=1
            done < <(find "$dir" -maxdepth 2 -type f \( -name '*.exe' -o -name '*.nupkg' -o -name 'RELEASES' \))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no installer artifacts were produced by electron-builder"
            exit 1
          fi
          ls -la "$GITHUB_WORKSPACE/installer-out"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer-out/
          if-no-files-found: error
          retention-days: 30

  # The renderer itself: all seven BlueMap implementations, built from the vendored
  # upstream source. Decision D18 makes the six Minecraft-server adapters product
  # artefacts alongside the CLI, so they are built on every push and attached to every
  # release. It is a called workflow rather than a separate one on its own trigger,
  # which is what puts its artifacts in this run where the release job can reach them.
  # Independent of `check`, so it runs beside the TypeScript build instead of after it.
  jars:
    name: BlueMap jars
    uses: ./.github/workflows/build-jars.yml

  screenshots:
    name: Screenshots
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: design/pnpm-lock.yaml

      - name: Install
        working-directory: design
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        working-directory: design
        run: pnpm build

      - name: Install Playwright browsers
        working-directory: design/packages/app
        run: pnpm exec playwright install-deps chromium

      # Electron needs a display. xvfb gives it one without a desktop session.
      - name: Capture
        working-directory: design/packages/app
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" pnpm run screenshots

      # Upload even when the capture failed: a diagnostic image of a broken
      # window is exactly the evidence needed to fix it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: design/packages/app/screenshots/
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-traces
          path: design/packages/app/test-results/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish release
    needs: [check, package, jars]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The line counter attributes surviving lines with `git blame`, so it
      # needs the full history rather than a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer-out

      # The seven jars were uploaded one artifact per implementation so a person can
      # take only the one their server needs; here they are collected back into one
      # directory, together with the checksums and the release-notes section the build
      # wrote from the jars it had actually produced.
      - uses: actions/download-artifact@v4
        with:
          pattern: bluemap-jar-*
          merge-multiple: true
          path: jars-out

      # Artifact upload and download is a round trip through someone else's storage, and
      # a jar that arrives short is a download that fails on a stranger's server rather
      # than here. The digests were taken from the bytes the build produced, so checking
      # them proves what is about to be published is what was actually built.
      - name: Verify the jars survived the artifact round trip
        shell: bash
        run: |
          set -euo pipefail
          cd jars-out
          shopt -s nullglob
          jars=(bluemap-*.jar)
          if [ "${#jars[@]}" -ne 7 ]; then
            echo "::error::expected all seven BlueMap jars, found ${#jars[@]}. A release must not ship a partial set."
            ls -la
            exit 1
          fi
          sha256sum -c bluemap-jars.sha256.txt
          ls -la

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./design/package.json').version")
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists; refusing to recycle a published release"
            exit 1
          fi
          # The release ordinal drives the dim sum code name. It is monotonic, so
          # a dish is never silently reused, and no ledger has to be committed
          # back by CI, which would be an automation loop.
          count=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq 'length')
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "ordinal=$((count + 1))"
          } >> "$GITHUB_OUTPUT"

      # Not a gate: a release must never be blocked because the photo catalog is
      # unavailable. A failure here is reported in the notes instead.
      - name: Resolve dim sum code name
        id: dish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/pick-dim-sum.mjs --ordinal "${{ steps.tag.outputs.ordinal }}" --out dim-sum-out

      - name: Compose release notes
        run: |
          set -euo pipefail
          {
            if [ -n "${{ steps.dish.outputs.dish_name_en }}" ]; then
              echo "**Code name: ${{ steps.dish.outputs.dish_name_en }} · ${{ steps.dish.outputs.dish_name_zh }}**"
              echo
              echo "![${{ steps.dish.outputs.dish_alt_en }}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.tag.outputs.tag }}/${{ steps.dish.outputs.dish_file_name }})"
              echo
              echo "Photo from the public \`Ding-Ding-Projects/dim-sum-photos\` catalog, volume \`${{ steps.dish.outputs.dish_volume }}\`, downloaded unchanged at release time and verified to decode. It is not stored in this repository."
            else
              echo "> [!NOTE]"
              echo "> No dim sum photo is attached to this release: resolving one from the photo catalog failed. The \`Resolve dim sum code name\` step in the run log has the exact URL and status. No substitute was generated."
            fi
            echo
            echo "## Install"
            echo
            echo "Download the Squirrel.Windows installer below. Windows only for now; macOS and Linux packaging land in a later phase."
            echo
            echo "The seven \`bluemap-*.jar\` files are a separate download and are not needed to install the desktop application. Take one only to run BlueMap on a Minecraft server or from a command line; the table below says which is which."
            echo
            cat jars-out/bluemap-jars.md
            echo "## What is in this build"
            echo
            echo "Commit \`${GITHUB_SHA}\` on \`main\`, built and tested by [run ${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). This release exists only because lint, build and the full test suite passed first."
            echo
            node scripts/count-lines.mjs --format=markdown
          } > release-notes.md
          echo "Composed $(wc -l < release-notes.md) lines of release notes"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=(installer-out/*)
          # The jars, their digests and the machine-readable index of what each one is.
          # bluemap-jars.md is deliberately left out: its text is already the release
          # notes above, and attaching it as well would publish the same words twice.
          assets+=(jars-out/bluemap-*.jar jars-out/bluemap-jars.sha256.txt jars-out/bluemap-jars.json)
          if [ -d dim-sum-out ] && [ -n "$(ls -A dim-sum-out 2>/dev/null)" ]; then
            assets+=(dim-sum-out/*)
          fi
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "material-bluemap ${{ steps.tag.outputs.tag }}" \
            --notes-file release-notes.md \
            "${assets[@]}"
          gh release view "${{ steps.tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
            --jq 'if .isDraft then error("release was published as a draft") else "published with \(.assets | length) assets" end'
