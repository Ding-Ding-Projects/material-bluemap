name: Render one wave of shards

# One wave of a sharded render: a matrix of at most 256 shard jobs.
#
# This is a reusable workflow rather than a job in render-world.yml because a matrix
# expands to at most 256 entries and Actions cannot generate a variable number of jobs.
# A world needing more shards than that is rendered in sequential waves, and the caller
# declares one job per wave slot, each calling this file with that wave's shard ids.
#
# Every shard here is independently resumable. Its map directory - tiles and rstate
# together - is cached under a key carrying the plan's fingerprint, and a shard that
# renders to completion writes a marker beside its output. A re-dispatched run restores
# the cache, checks the marker, and skips every shard that is already done. A run that
# dies in wave 7 therefore costs wave 7 and not the six waves before it.
#
# See design/packages/render-actions/src/resume/ for the logic, which is under test, and
# docs/resumable-renders.md for why the cache holds rstate while the merge refuses to.

on:
  workflow_call:
    inputs:
      wave:
        description: Which wave this is, for job names and the run summary
        type: number
        required: true
      shards:
        description: JSON array of shard ids this wave renders
        type: string
        required: true
      map-id:
        type: string
        required: true
      map-name:
        type: string
        required: true
      accept-download:
        description: '1 to allow the Minecraft client download, 0 to refuse it'
        type: string
        required: true

permissions:
  contents: read

jobs:
  render:
    name: Wave ${{ inputs.wave }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Below GitHub's own six hour ceiling. The render step has a shorter timeout still,
    # so a shard that runs out of time fails that one step rather than having the job
    # cancelled underneath it - which is what lets the cache be saved and the partial
    # output uploaded instead of thrown away.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: design/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        working-directory: design
        run: pnpm install --frozen-lockfile

      - name: Build the planner
        working-directory: design
        run: pnpm --filter "@material-bluemap/render-actions..." run build

      - uses: actions/download-artifact@v4
        with:
          name: bluemap-cli
          path: cli

      - uses: actions/download-artifact@v4
        with:
          name: world
          path: world-in

      - uses: actions/download-artifact@v4
        with:
          name: render-plan

      # Where this shard sits: which merge group takes it on, what its artifact is
      # called, and the cache key it saves under. The key carries the plan fingerprint,
      # so a cache saved for a different shard layout can never be restored on top of
      # this one - that rstate would claim work this shard never did.
      - name: Locate this shard
        id: shard
        run: |
          node design/packages/render-actions/dist/cli.js waves \
            --plan shard-plan.json \
            --shard '${{ matrix.shard }}' \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --github-output "$GITHUB_OUTPUT"

      # Restore rather than the full cache action, so the save below is an explicit step
      # that still runs after a render that ran out of time.
      - name: Restore this shard's render state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            bluemap-out/maps
            bluemap-data
          key: ${{ steps.shard.outputs.cache-key }}
          restore-keys: ${{ steps.shard.outputs.cache-restore-prefix }}

      # Only output carrying a completion marker that agrees with what is on disk counts
      # as finished. Anything else is unfinished and is rendered again, continuing from
      # whatever the restore brought back.
      - name: Is this shard already finished?
        id: resume
        run: |
          node design/packages/render-actions/dist/cli.js resume-check \
            --plan shard-plan.json \
            --shard '${{ matrix.shard }}' \
            --storage-root "$GITHUB_WORKSPACE/bluemap-out/maps" \
            --map-id '${{ inputs.map-id }}' \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      # Every path written here is absolute. The BlueMap CLI resolves its data directory
      # and its storage root against the process working directory rather than against
      # the config folder, so a relative path quietly puts the map somewhere else.
      - name: Write this shard's BlueMap config
        if: steps.resume.outputs.complete != 'true'
        run: |
          node design/packages/render-actions/dist/cli.js config \
            --plan shard-plan.json \
            --shard '${{ matrix.shard }}' \
            --world "$GITHUB_WORKSPACE/world-in" \
            --config-dir "$GITHUB_WORKSPACE/bluemap-config" \
            --data-dir "$GITHUB_WORKSPACE/bluemap-data" \
            --storage-root "$GITHUB_WORKSPACE/bluemap-out/maps" \
            --web-root "$GITHUB_WORKSPACE/bluemap-out" \
            --map-name '${{ inputs.map-name }}' \
            --threads 4 \
            --accept-download '${{ inputs.accept-download }}'

      # A standard runner has 16 GB. 10 GB of heap leaves enough for the OS and the
      # runner agent; the render is disk- and CPU-bound long before it is heap-bound.
      #
      # `continue-on-error` with a step timeout, deliberately. A shard that runs out of
      # time has produced hours of real tiles, and the steps after this one are what get
      # them off the runner before it disappears. Failing the job here would skip them.
      - name: Render
        id: render
        if: steps.resume.outputs.complete != 'true'
        continue-on-error: true
        timeout-minutes: 300
        run: java -Xmx10G -jar "$GITHUB_WORKSPACE/cli/bluemap-cli.jar" -c "$GITHUB_WORKSPACE/bluemap-config" -r -g

      # Written only after a clean exit. Its absence is the signal that this shard was
      # cut off, and a resume must never mistake a truncated write for finished work.
      - name: Mark this shard finished
        if: steps.resume.outputs.complete != 'true' && steps.render.outcome == 'success'
        run: |
          node design/packages/render-actions/dist/cli.js shard-complete \
            --plan shard-plan.json \
            --shard '${{ matrix.shard }}' \
            --storage-root "$GITHUB_WORKSPACE/bluemap-out/maps" \
            --map-id '${{ inputs.map-id }}' \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}'

      # Saved whether the render finished or not: an unfinished shard's tiles and rstate
      # are exactly what makes the next dispatch cheap. Skipped on an exact key hit,
      # because nothing new was rendered.
      - name: Save this shard's render state
        if: always() && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            bluemap-out/maps
            bluemap-data
          key: ${{ steps.shard.outputs.cache-key }}

      - name: Report what this shard produced
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          map="bluemap-out/maps/${{ inputs.map-id }}"
          # Not `set -e`: this step runs after a render that may have produced nothing at
          # all, and a `find` over a directory that does not exist must report zero rather
          # than take the step down with it.
          hires=0
          if [ -d "$map/tiles/0" ]; then
            hires=$(find "$map/tiles/0" -type f | wc -l)
          fi
          {
            echo "### Wave ${{ inputs.wave }}, shard ${{ matrix.shard }}"
            echo ""
            echo "- hires tiles: $hires"
            echo "- map size: $(du -sh "$map" 2>/dev/null | cut -f1 || echo unknown)"
            echo "- render step: ${{ steps.render.outcome || 'skipped, already finished' }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.render.outcome }}" = "failure" ]; then
            echo "::warning::Shard ${{ matrix.shard }} did not finish. Its state is cached; re-dispatch this workflow to carry it on."
          fi

      # Uploaded whether or not it finished. The marker inside says which it was, and the
      # merge refuses any shard whose marker is missing rather than merging it short.
      # `include-hidden-files` is off, so nothing here is named with a leading dot.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.shard.outputs.shard-artifact }}
          path: bluemap-out/maps
          retention-days: 1
          compression-level: 1

      # The webapp shell is identical from every shard, so exactly one of them uploads it.
      - uses: actions/upload-artifact@v4
        if: inputs.wave == 1 && matrix.shard == 0
        with:
          name: webapp
          path: |
            bluemap-out
            !bluemap-out/maps
          retention-days: 1
