name: Bootstrap self-hosted runner dependencies
description: Install only the pinned tools and OS packages required by one self-hosted job.

inputs:
  profile:
    description: Hand-written dependency profile for the calling workflow job.
    required: true

runs:
  using: composite
  steps:
    - name: Bootstrap Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../../scripts/bootstrap-self-hosted-linux.sh" "${{ inputs.profile }}"

    - name: Bootstrap Windows dependencies
      if: runner.os == 'Windows'
      shell: powershell
      run: >-
        & (Join-Path $env:GITHUB_ACTION_PATH '..\..\scripts\bootstrap-self-hosted-windows.ps1')
        -Profile '${{ inputs.profile }}'

    - name: Reject unsupported runner operating systems
      if: runner.os != 'Linux' && runner.os != 'Windows'
      shell: bash
      run: |
        echo "::error::self-hosted dependency profile '${{ inputs.profile }}' has no bootstrap for runner OS '${{ runner.os }}'"
        exit 1
