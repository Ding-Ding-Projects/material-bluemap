packages:
  - packages/*
  - tools/*

# pnpm 10 no longer reads the `pnpm` field from package.json and prints a warning
# that these keys were ignored. Left there, electron's postinstall never runs, its
# binary is never downloaded, and `electron.launch` fails with "Electron failed to
# install correctly" — which is why the screenshot harness could not start.
onlyBuiltDependencies:
  - esbuild
  - electron
  - better-sqlite3
